basePath: /v1
definitions:
  entity.Medicine:
    properties:
      id:
        example: 1789dfb3-e060-433a-9db4-cb93b42768d8
        type: string
      name:
        example: Panadol
        type: string
      price:
        example: 10000
        type: integer
      quantity:
        example: 100
        type: integer
    type: object
  entity.MedicineDetail:
    properties:
      description:
        example: For pain relief
        type: string
      id:
        example: 1789dfb3-e060-433a-9db4-cb93b42768d8
        type: string
      medicine_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      quantity:
        example: 2
        type: integer
      signa_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      transaction_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    type: object
  entity.Patient:
    properties:
      age:
        example: 30
        type: integer
      gender:
        example: male
        type: string
      id:
        example: 1789dfb3-e060-433a-9db4-cb93b42768d8
        type: string
      name:
        example: John Doe
        type: string
    type: object
  entity.Signa:
    properties:
      description:
        example: Before eat
        type: string
      id:
        example: 1789dfb3-e060-433a-9db4-cb93b42768d8
        type: string
      signa:
        example: a.c
        type: string
    type: object
  entity.Transaction:
    properties:
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      medicine_detail:
        items:
          $ref: '#/definitions/entity.MedicineDetail'
        type: array
      medicine_type:
        example: compound
        type: string
      patient_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      payment_redirect_url:
        example: https://example.com/redirect
        type: string
      payment_token:
        example: https://example.com/token
        type: string
      status:
        example: pending
        type: string
      total_medicines:
        example: 3
        type: integer
      total_price:
        example: 15000
        type: integer
    type: object
  request.CreateTransaction:
    properties:
      descriptions:
        example:
        - For pain relief
        items:
          type: string
        type: array
      medicine_type:
        enum:
        - compound
        - non_compound
        example: compound
        type: string
      medicines:
        example:
        - 123e4567-e89b-12d3-a456-426614174000
        items:
          type: string
        type: array
      patient_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      quantities:
        example:
        - 2
        items:
          type: integer
        type: array
      signas:
        example:
        - 123e4567-e89b-12d3-a456-426614174000
        items:
          type: string
        type: array
    required:
    - descriptions
    - medicine_type
    - medicines
    - patient_id
    - quantities
    - signas
    type: object
  request.Medicine:
    properties:
      name:
        example: Panadol
        type: string
      price:
        example: 10000
        minimum: 0
        type: integer
      quantity:
        example: 100
        minimum: 0
        type: integer
    required:
    - name
    - price
    - quantity
    type: object
  request.MedicineDetail:
    properties:
      description:
        example: For pain relief
        type: string
      medicine_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      quantity:
        example: 2
        minimum: 0
        type: integer
      signa_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - quantity
    type: object
  request.Patient:
    properties:
      age:
        example: 30
        maximum: 120
        minimum: 0
        type: integer
      gender:
        enum:
        - male
        - female
        example: male
        type: string
      name:
        example: John Doe
        type: string
    required:
    - gender
    - name
    type: object
  request.Signa:
    properties:
      description:
        example: Before eat
        type: string
      signa:
        example: a.c
        type: string
    required:
    - description
    - signa
    type: object
  request.UpdateTransaction:
    properties:
      medicine_type:
        enum:
        - compound
        - non-compound
        example: compound
        type: string
      total_medicines:
        example: 3
        minimum: 0
        type: integer
      total_price:
        example: 15000
        minimum: 0
        type: integer
    required:
    - medicine_type
    - total_medicines
    - total_price
    type: object
  response.Error:
    properties:
      error:
        example: message
        type: string
    type: object
  response.SuccessMedicine:
    properties:
      data:
        $ref: '#/definitions/entity.Medicine'
      message:
        example: success
        type: string
    type: object
  response.SuccessMedicineDetail:
    properties:
      data:
        $ref: '#/definitions/entity.MedicineDetail'
      message:
        example: success
        type: string
    type: object
  response.SuccessMedicineDetailList:
    properties:
      data:
        items:
          $ref: '#/definitions/entity.MedicineDetail'
        type: array
      message:
        example: success
        type: string
    type: object
  response.SuccessMedicineList:
    properties:
      data:
        items:
          $ref: '#/definitions/entity.Medicine'
        type: array
      message:
        example: success
        type: string
    type: object
  response.SuccessPatient:
    properties:
      data:
        $ref: '#/definitions/entity.Patient'
      message:
        example: success
        type: string
    type: object
  response.SuccessPatientList:
    properties:
      data:
        items:
          $ref: '#/definitions/entity.Patient'
        type: array
      message:
        example: success
        type: string
    type: object
  response.SuccessSigna:
    properties:
      data:
        $ref: '#/definitions/entity.Signa'
      message:
        example: success
        type: string
    type: object
  response.SuccessSignaList:
    properties:
      data:
        items:
          $ref: '#/definitions/entity.Signa'
        type: array
      message:
        example: success
        type: string
    type: object
  response.SuccessString:
    properties:
      data:
        example: deleted
        type: string
      message:
        example: success
        type: string
    type: object
  response.SuccessTransaction:
    properties:
      data:
        $ref: '#/definitions/entity.Transaction'
      message:
        example: success
        type: string
    type: object
  response.SuccessTransactionList:
    properties:
      data:
        items:
          $ref: '#/definitions/entity.Transaction'
        type: array
      message:
        example: success
        type: string
    type: object
